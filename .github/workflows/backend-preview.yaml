name: Backend Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - backend/**
      - .github/workflows/backend-preview.yaml

permissions:
  contents: read
  pull-requests: read

jobs:
  Deploy-Preview:
    # Set the repository variable ENABLE_VERCEL to 'true' once the Vercel projects
    # and secrets are configured (see docs/deployment.md).
    if: ${{ vars.ENABLE_VERCEL == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: pnpm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts
        run: >
          vercel deploy --prebuilt --yes
          --token=${{ secrets.VERCEL_TOKEN }}
          --meta githubCommitSha=${{ github.event.pull_request.head.sha }}
          --meta githubCommitRef=${{ github.event.pull_request.head.ref }}
