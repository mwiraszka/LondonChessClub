@if (!codeSent()) {
  <form
    class="auth-form"
    (ngSubmit)="onSendCode()">
    <ea-input
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      [autofocus]="true"
      [required]="true"
      [errorMsg]="emailError()"
      (blurred)="onEmailBlur()"
      [value]="email()"
      (valueChange)="onEmailChange($event)" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="loading()">
      Send reset code
    </ea-button>
  </form>

  <p class="auth-link">
    <button
      type="button"
      class="auth-link__button lcc-link"
      (click)="authDrawer.setMode('login')">
      Back to log in
    </button>
  </p>
} @else {
  <form
    class="auth-form"
    (ngSubmit)="onResetPassword()">
    <p class="hint">
      If an account exists for {{ email() }}, a reset code is on its way. Enter it below
      with your new password.
    </p>

    <ea-input
      label="Reset Code"
      autocomplete="one-time-code"
      placeholder="Enter code"
      [autofocus]="true"
      [required]="true"
      [errorMsg]="codeError()"
      [value]="code()"
      (valueChange)="onCodeChange($event)" />

    <ea-input
      label="New Password"
      type="password"
      autocomplete="new-password"
      [required]="true"
      [errorMsg]="newPasswordError()"
      (blurred)="onNewPasswordBlur()"
      [value]="newPassword()"
      (valueChange)="onNewPasswordChange($event)" />

    <ea-input
      label="Confirm Password"
      type="password"
      autocomplete="new-password"
      [required]="true"
      [errorMsg]="confirmPasswordError()"
      (blurred)="onConfirmPasswordBlur()"
      [value]="confirmPassword()"
      (valueChange)="onConfirmPasswordChange($event)" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [loading]="loading()">
      Reset password
    </ea-button>
  </form>

  <p class="auth-link">
    <button
      type="button"
      class="auth-link__button lcc-link"
      (click)="authDrawer.setMode('login')">
      Back to log in
    </button>
  </p>
}
