<div class="nav-left"></div>

<div class="content-container">
  <div class="nav-links">
    @for (link of links; track link.internalPath) {
      <a
        [attr.aria-label]="link.text"
        class="nav-link"
        routerLinkActive="link-active"
        [routerLink]="link.internalPath | routerLink"
        [routerLinkActiveOptions]="{ exact: true }"
        [tooltip]="screenWidth > 800 ? null : link.text">
        <span class="link-text">{{ link.text }}</span>
        <mat-icon class="link-icon">{{ link.icon }}</mat-icon>
      </a>
    }
  </div>

  <div class="nav-mid"></div>

  <div class="nav-controls">
    <button
      aria-label="Toggle theme"
      class="control-button lcc-icon-button"
      [tooltip]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="onToggleTheme()">
      <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button
      aria-label="Toggle wide view"
      class="control-button wide-view-button lcc-icon-button"
      [tooltip]="isWideView() ? 'Disable wide view' : 'Enable wide view'"
      (click)="onToggleWideView()">
      <mat-icon>{{ isWideView() ? 'zoom_in_map' : 'zoom_out_map' }}</mat-icon>
    </button>

    @if (isTouchDevice) {
      <button
        aria-label="Toggle desktop view"
        class="control-button lcc-icon-button"
        [tooltip]="isDesktopView() ? 'Disable desktop view' : 'Enable desktop view'"
        (click)="onToggleDesktopView()">
        <mat-icon>{{ isDesktopView() ? 'phone_iphone' : 'desktop_windows' }}</mat-icon>
      </button>
    }

    @if (user()) {
      <button
        aria-label="Account menu"
        class="avatar-button"
        dropdown
        (isOpen)="isDropdownOpen = $event">
        <ea-avatar
          size="sm"
          alt="Your avatar"
          [src]="avatarSrc()"
          [initials]="initials()" />
      </button>
    } @else {
      <button
        aria-label="Log in"
        class="login-button"
        (click)="onLogin()">
        Log in
      </button>
    }
  </div>
</div>

<div class="nav-right"></div>
